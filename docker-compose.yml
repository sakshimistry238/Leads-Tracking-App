version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leads-backend
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
    volumes:
      # Persist the SQLite database between container restarts
      - sqlite-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/leads']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leads-frontend
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
